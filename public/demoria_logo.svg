<?xml version="1.0" encoding="UTF-8"?>
<!--
  Demoria Research — master sigil
  Population pyramid arch (8 stepped bars per side + semicircular arch)
  containing the diamond age-pyramid (regular pyramid below + inverted
  pyramid above, joined at the median).

  Colour: #c49a28 / #e0b54a (Demoria gold). Set via `color` attribute
  on the root <svg> — every stroke inherits via currentColor.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 500"
     width="300" height="250"
     color="#c49a28"
     aria-label="Demoria Research">

  <!-- Population pyramid bars + arch -->
  <g stroke="currentColor" stroke-width="2.6" fill="none">
    <rect x="200" y="100" width="50"  height="38"/>
    <rect x="178" y="138" width="72"  height="38"/>
    <rect x="156" y="176" width="94"  height="38"/>
    <rect x="134" y="214" width="116" height="38"/>
    <rect x="112" y="252" width="138" height="38"/>
    <rect x="90"  y="290" width="160" height="38"/>
    <rect x="68"  y="328" width="182" height="38"/>
    <rect x="46"  y="366" width="204" height="38"/>
    <rect x="350" y="100" width="50"  height="38"/>
    <rect x="350" y="138" width="72"  height="38"/>
    <rect x="350" y="176" width="94"  height="38"/>
    <rect x="350" y="214" width="116" height="38"/>
    <rect x="350" y="252" width="138" height="38"/>
    <rect x="350" y="290" width="160" height="38"/>
    <rect x="350" y="328" width="182" height="38"/>
    <rect x="350" y="366" width="204" height="38"/>
    <path d="M 250 100 A 50 50 0 0 1 350 100"/>
  </g>

  <!-- Diamond age-pyramid inside the doorway -->
  <g stroke="currentColor" stroke-width="2.6" fill="none" stroke-linejoin="miter">
    <path d="M 270 160 L 330 160 L 300 250 Z"/>
    <path d="M 270 350 L 330 350 L 300 250 Z"/>
  </g>

  <!-- Median reference line (dashed) -->
  <line x1="252" y1="250" x2="348" y2="250"
        stroke="currentColor" stroke-width="1.6" opacity="0.5" stroke-dasharray="3 3"/>
</svg>
